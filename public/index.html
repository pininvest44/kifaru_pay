<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk STK Push Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
  <div class="max-w-6xl mx-auto p-6">
    <header class="mb-8 border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Bulk M-Pesa STK Push</h1>
      <p class="text-sm text-gray-600">Rate-limited execution (Max 15 requests/min)</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Input Form -->
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-xl font-semibold mb-4">New Request</h2>
        <form id="stkForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Phone Numbers (One per line or comma-separated)</label>
            <textarea id="numbersText" rows="6" required placeholder="0712345678&#10;254789012345&#10;0112345678" class="w-full p-2 border rounded font-mono text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Amount (KES)</label>
            <input type="number" id="amount" required min="1" placeholder="100" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Account Reference</label>
            <input type="text" id="accountReference" required placeholder="ORDER-BULK" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Description</label>
            <input type="text" id="description" placeholder="Payment Description" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded transition">
            Start Bulk Push
          </button>
        </form>
      </div>

      <!-- Live Dashboard & Logs -->
      <div class="lg:col-span-2 space-y-6">
        <!-- Progress Bar & Stats -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
          <div class="flex justify-between items-center mb-2">
            <span class="text-sm font-semibold">Queue Progress</span>
            <span id="queueCount" class="text-sm font-mono text-gray-500">Queue: 0</span>
          </div>
          <div class="w-full bg-gray-200 rounded-full h-3 mb-4 overflow-hidden">
            <div id="progressBar" class="bg-blue-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
          <div class="grid grid-cols-4 gap-2 text-center text-xs">
            <div class="bg-gray-50 p-2 rounded"><span class="block text-gray-500">Total</span><strong id="statTotal" class="text-base">0</strong></div>
            <div class="bg-gray-50 p-2 rounded"><span class="block text-gray-500">Done</span><strong id="statDone" class="text-base">0</strong></div>
            <div class="bg-emerald-50 p-2 rounded"><span class="block text-emerald-600">Success</span><strong id="statSuccess" class="text-base text-emerald-700">0</strong></div>
            <div class="bg-red-50 p-2 rounded"><span class="block text-red-600">Failed</span><strong id="statFailed" class="text-base text-red-700">0</strong></div>
          </div>
        </div>

        <!-- Real-time Log Table -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
          <h3 class="text-lg font-semibold mb-3">Live Execution Logs</h3>
          <div class="overflow-x-auto max-h-80 overflow-y-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-gray-50 sticky top-0 border-b">
                <tr>
                  <th class="p-2">Time</th>
                  <th class="p-2">Phone</th>
                  <th class="p-2">Amount</th>
                  <th class="p-2">Status</th>
                  <th class="p-2">Details</th>
                </tr>
              </thead>
              <tbody id="logTableBody" class="divide-y">
                <tr><td colspan="5" class="p-4 text-center text-gray-400">No transactions recorded yet.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
